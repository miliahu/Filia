services:
  postgres:
    image: postgres:16-alpine
    container_name: filia-postgres
    environment:
      POSTGRES_DB: filia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: filia-rustfs
    environment:
      RUSTFS_ACCESS_KEY: rustfs-access-key
      RUSTFS_SECRET_KEY: rustfs-secret-key
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - rustfs-data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: filia-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  filia-api:
    build:
      context: .
      dockerfile: src/Filia.Api/Dockerfile
    container_name: filia-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__FiliaDb: "Host=postgres;Port=5432;Database=filia;Username=postgres;Password=postgres"
      RustFs__Endpoint: "http://rustfs:9000"
      RustFs__AccessKey: "rustfs-access-key"
      RustFs__SecretKey: "rustfs-secret-key"
      RustFs__BucketName: "filia-files"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__UserName: "guest"
      RabbitMq__Password: "guest"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
      rabbitmq:
        condition: service_started

volumes:
  postgres-data:
  rustfs-data:
  rabbitmq-data:
